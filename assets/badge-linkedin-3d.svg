<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 38" width="200" height="38">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="125%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="darkSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4e58"/>
      <stop offset="40%" stop-color="#2d3038"/>
      <stop offset="100%" stop-color="#191a1f"/>
    </linearGradient>

    <linearGradient id="linkedInBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d8cf0"/>
      <stop offset="25%" stop-color="#0a66c2"/>
      <stop offset="75%" stop-color="#084e96"/>
      <stop offset="100%" stop-color="#053363"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base Shape Outer Border -->
    <rect x="1" y="1" width="196" height="32" rx="6" fill="#15161a" stroke="url(#borderGrad)" stroke-width="1.2"/>

    <!-- Left (Dark) Side: LINKEDIN -->
    <path d="M 2 6 C 2 3.8 3.8 2 6 2 L 105 2 L 105 32 L 6 32 C 3.8 32 2 30.2 2 28 Z" fill="url(#darkSide)"/>
    <path d="M 2 6 C 2 3.8 3.8 2 6 2 L 105 2 L 105 32 L 6 32 C 3.8 32 2 30.2 2 28 Z" fill="url(#gloss)"/>

    <!-- Divider Line -->
    <line x1="105" y1="2" x2="105" y2="32" stroke="#121316" stroke-width="1.5"/>
    <line x1="106" y1="2" x2="106" y2="32" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.2"/>

    <!-- Right (Color) Side: CONNECT -->
    <path d="M 106 2 L 191 2 C 193.2 2 195 3.8 195 6 L 195 28 C 195 30.2 193.2 32 191 32 L 106 32 Z" fill="url(#linkedInBlue)"/>
    <path d="M 106 2 L 191 2 C 193.2 2 195 3.8 195 6 L 195 28 C 195 30.2 193.2 32 191 32 L 106 32 Z" fill="url(#gloss)"/>

    <!-- LinkedIn Icon -->
    <g transform="translate(10, 8)" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.5))">
      <path fill="#ffffff" d="M14.82 2.5H3.18C2.53 2.5 2 3.03 2 3.68v11.64c0 .65.53 1.18 1.18 1.18h11.64c.65 0 1.18-.53 1.18-1.18V3.68c0-.65-.53-1.18-1.18-1.18zM6.45 13.9H4.27V7.12h2.18v6.78zM5.36 6.17c-.7 0-1.26-.57-1.26-1.26s.57-1.27 1.26-1.27c.7 0 1.26.57 1.26 1.27s-.56 1.26-1.26 1.26zm8.54 7.73h-2.18V10.5c0-.81-.02-1.85-1.13-1.85-1.13 0-1.3 1.05-1.3 1.79v3.46H7.11V7.12h2.09v.93h.03c.29-.55 1-1.13 2.06-1.13 2.2 0 2.61 1.45 2.61 3.34v3.64z"/>
    </g>

    <!-- Text: LINKEDIN -->
    <text x="34" y="21.5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.8))">LINKEDIN</text>

    <!-- Text: CONNECT -->
    <text x="151" y="21.5" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.7))">CONNECT</text>
  </g>
</svg>
